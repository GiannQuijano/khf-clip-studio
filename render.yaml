# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: khf-clip-studio
    runtime: docker
    plan: standard           # 1 CPU / 2 GB: the smallest size that transcribes reliably ($25/month)
    healthCheckPath: /api/config
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # Render asks you to paste it during setup
      - key: WHISPER_MODEL
        value: small         # good accuracy on 2 GB; use base on smaller instances
      - key: DATA_DIR
        value: /data
    disk:
      name: clip-data
      mountPath: /data
      sizeGB: 10
